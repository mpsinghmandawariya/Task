services:
  ml-service:
    build: ./ml-service
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      ML_SERVICE_URL: http://ml-service:8000
      SQLITE_PATH: /data/wordwise.sqlite
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      ml-service:
        condition: service_healthy
    volumes:
      - wordwise_sqlite_data:/data
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  wordwise_sqlite_data:
